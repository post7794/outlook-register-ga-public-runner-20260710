name: CTF Windows FlashBrowser probe

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: "Private source ref (commit or branch)"
        required: true
        default: "700e9f28d973d1b9fd3e4e9a254b216e586843a2"
      timeout_minutes:
        description: "Job timeout minutes"
        required: true
        default: "25"
      runs:
        description: "Sequential attempts in one job"
        required: true
        default: "1"

jobs:
  flash-probe:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      PYTHONIOENCODING: utf-8
      FLASH_URL: https://github.com/Mzying2001/CefFlashBrowser/releases/download/1.1.7/FlashBrowser_x64_v1.1.7.zip
      FLASH_EXE_SHA256: f4bd178341d2a40a1ca62db92612f4c3c3955f23a440b5ba315feeb3a179aa3e
      LIBCEF_SHA256: 99582246af5a98c5f31a34d3e727c61f8352cebf00b1145959fc801b11c4f91b
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          ref: ${{ inputs.private_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install websocket-client

      - name: Download FlashBrowser
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path D:\a\flash | Out-Null
          Invoke-WebRequest -Uri "$env:FLASH_URL" -OutFile D:\a\flash\flash.zip
          Expand-Archive -Path D:\a\flash\flash.zip -DestinationPath D:\a\flash -Force
          $dir = Get-ChildItem -Path D:\a\flash -Directory | Where-Object Name -like "FlashBrowser*" | Select-Object -First 1
          if (-not $dir) { throw "extracted dir not found" }
          Write-Host "FLASH_DIR_ACTUAL=$($dir.FullName)"
          "FLASH_DIR_ACTUAL=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $exe = Get-FileHash -Algorithm SHA256 (Join-Path $dir.FullName "CefFlashBrowser.exe")
          $cef = Get-FileHash -Algorithm SHA256 (Join-Path $dir.FullName "Assets\CefSharp\libcef.dll")
          if ($exe.Hash.ToLower() -ne $env:FLASH_EXE_SHA256) { throw "exe hash mismatch: $($exe.Hash)" }
          if ($cef.Hash.ToLower() -ne $env:LIBCEF_SHA256) { throw "libcef hash mismatch: $($cef.Hash)" }
          Write-Host "hashes verified"

      - name: Skip language dialog
        shell: pwsh
        run: |
          $dir = "$env:FLASH_DIR_ACTUAL"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\Documents\CefFlashBrowser" | Out-Null
          Set-Content -Path "$env:USERPROFILE\Documents\CefFlashBrowser\settings.json" -Value '{"FirstStart": false, "Language": "zh-CN"}' -Encoding UTF8
          Get-Content "$env:USERPROFILE\Documents\CefFlashBrowser\settings.json"

      - name: Run FlashBrowser probe
        id: probe
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $dir = "$env:FLASH_DIR_ACTUAL"
          $runs = [int]"${{ inputs.runs }}"
          $results = @()
          for ($i = 1; $i -le $runs; $i++) {
            Write-Host "=== ATTEMPT $i / $runs ==="
            Get-Process CefFlashBrowser -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            if (Test-Path "$dir\Caches") { Remove-Item -Recurse -Force "$dir\Caches" }
            Start-Process -FilePath (Join-Path $dir "CefFlashBrowser.exe") -ArgumentList '"about:blank"','--remote-debugging-port=9333' -WorkingDirectory $dir
            Start-Sleep -Seconds 10
            python flash_ga\flash_fill_ga.py 2>&1 | Tee-Object -FilePath "flash-attempt-$i.log"
            $code = $LASTEXITCODE
            Write-Host "attempt $i exit=$code"
            $results += "attempt_$i=$code"
            if ($code -eq 0) { break }
          }
          $summary = $results -join " "
          "exit_summary=$summary" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SUMMARY: $summary"

      - name: Summarize result
        if: always()
        shell: pwsh
        run: |
          "## CTF Windows FlashBrowser probe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "private_ref=${{ inputs.private_ref }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "exit_summary=${{ steps.probe.outputs.exit_summary }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "### Result lines" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem -Filter "flash-attempt-*.log" | ForEach-Object {
            Get-Content $_.FullName | Select-String -Pattern "GA_RESULT|VERDICT|\[flow\]|\[state\]" | Select-Object -Last 40 | ForEach-Object { $_.Line }
          } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload filtered evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path flash-evidence | Out-Null
          Get-ChildItem -Filter "flash-attempt-*.log" | ForEach-Object {
            $filtered = Join-Path "flash-evidence" $_.Name
            Get-Content $_.FullName | Select-String -Pattern "GA_RESULT|VERDICT|\[flow\]|\[state\]|human pause" | ForEach-Object { $_.Line } | Set-Content -Path $filtered
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-probe-${{ github.run_id }}
          path: flash-evidence/
