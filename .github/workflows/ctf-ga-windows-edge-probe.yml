name: CTF Windows real-Edge probe

on:
  workflow_dispatch:
    inputs:
      private_ref:
        description: "Private source ref (full 40-char SHA or branch)"
        required: true
        default: "main"
      timeout_minutes:
        description: "Job timeout minutes"
        required: true
        default: "25"
      runs:
        description: "Sequential attempts in one job"
        required: true
        default: "1"

jobs:
  edge-probe:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      PYTHONIOENCODING: utf-8
      PROBE_FIXED_PASSWORD: ${{ secrets.PROBE_FIXED_PASSWORD }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          ref: ${{ inputs.private_ref }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}

      - name: Locate Edge
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "msedge.exe not found" }
          Write-Host "EDGE=$edge"
          (Get-Item $edge).VersionInfo.FileVersion

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install patchright websocket-client

      - name: Run real-Edge probe
        id: probe
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $runs = [int]"${{ inputs.runs }}"
          $results = @()
          for ($i = 1; $i -le $runs; $i++) {
            Write-Host "=== ATTEMPT $i / $runs ==="
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 1
            if (Test-Path D:\a\edge-profile) { Remove-Item -Recurse -Force D:\a\edge-profile }
            python edge_ga\edge_fill_ga.py 2>&1 | Tee-Object -FilePath "edge-attempt-$i.log"
            $code = $LASTEXITCODE
            Write-Host "attempt $i exit=$code"
            $results += "attempt_$i=$code"
            if ($code -eq 0) { break }
          }
          $summary = $results -join " "
          "exit_summary=$summary" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SUMMARY: $summary"

      - name: Summarize result
        if: always()
        shell: pwsh
        run: |
          "## CTF Windows real-Edge probe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "private_ref=${{ inputs.private_ref }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "exit_summary=${{ steps.probe.outputs.exit_summary }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "### Result lines" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem -Filter "edge-attempt-*.log" | ForEach-Object {
            Get-Content $_.FullName | Select-String -Pattern "GA_RESULT|verify=|\[\d\d:" | Select-Object -Last 60 | ForEach-Object { $_.Line }
          } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload filtered evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path edge-evidence | Out-Null
          Get-ChildItem -Filter "edge-attempt-*.log" | ForEach-Object {
            $filtered = Join-Path "edge-evidence" $_.Name
            Get-Content $_.FullName | ForEach-Object { $_ } | Set-Content -Path $filtered
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-probe-${{ github.run_id }}
          path: edge-evidence/
