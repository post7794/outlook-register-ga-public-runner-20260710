name: CTF paired preverify metadata read-time diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: preverify-readtime-pair-20261006
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      CLOAKBROWSER_SUPPRESS_FONT_WARNING: '1'
      RESULTS_ENCRYPTION_CERT_B64: ${{ vars.RESULTS_ENCRYPTION_CERT_B64 }}
      GA_VARIANT: same_session_oauth_security_email_fresh1
      GA_NETWORK_MODE: ga_own_ip
      GA_SLOT: '1'
    steps:
    - name: Lock one diagnostic run
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_REF" = "refs/heads/exp/preverify-readtime-pair-20261006"

        test "$GITHUB_RUN_ATTEMPT" = "1"

        echo "One runner, two clean sessions, one preverify per arm, no CAPTCHA or account creation"

        '
    - name: Checkout fixed private source
      uses: actions/checkout@v4
      with:
        repository: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
        ref: c98f52a1fab80df3ab125ebb2b221521965f8b2b
        ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
        persist-credentials: false
    - name: Verify source and record egress
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "c98f52a1fab80df3ab125ebb2b221521965f8b2b"

        mkdir -p Results/diagnostics

        ip="$(curl -fsS --max-time 15 https://api.ipify.org)"

        printf ''GA_PUBLIC_IP=%s

        '' "$ip" >> "$GITHUB_ENV"

        '
    - name: Install pinned SunBrowser LocalFP runtime
      shell: bash
      env:
        NETWORK_MODE_INPUT: ga_own_ip
      run: "set -euxo pipefail\nif [ \"$NETWORK_MODE_INPUT\" != \"ga_own_ip\" ]; then\n  echo \"SunBrowser public-runner v1\
        \ requires network_mode=ga_own_ip so region can fail closed to us\" >&2\n  exit 2\nfi\nSUNBROWSER_REGION_INPUT=us\n\
        asset=\"SunBrowser-LocalFP-Linux-x64-20260718.tar.gz\"\nexpected=\"d1f881602e4e07c873154f3acd745b8772739c5f7469721c39eef0741b96235a\"\
        \nurl=\"https://github.com/post7794/outlook-register-ga-public-runner-20260710/releases/download/sunbrowser-localfp-20260718/$asset\"\
        \narchive_dir=\"$RUNNER_TEMP/sunbrowser-localfp-archive\"\ninstall_dir=\"$RUNNER_TEMP/sunbrowser-localfp\"\nmkdir\
        \ -p \"$archive_dir\" \"$install_dir\" Results/diagnostics\ncurl -fsSL --retry 4 --retry-all-errors \"$url\" -o \"\
        $archive_dir/$asset\"\necho \"$expected  $archive_dir/$asset\" | sha256sum -c -\ntar -xzf \"$archive_dir/$asset\"\
        \ -C \"$install_dir\"\nroot=\"$install_dir/SunBrowser-LocalFP-Linux-x64-20260718\"\ntest -f \"$root/MANIFEST.sha256\"\
        \nif ! (cd \"$root\" && sha256sum -c MANIFEST.sha256) > Results/diagnostics/sunbrowser-manifest.log 2>&1; then\n \
        \ tail -80 Results/diagnostics/sunbrowser-manifest.log\n  exit 1\nfi\nchmod +x \"$root/tools/node\" \"$root/runtime/SunBrowser\"\
        \ \"$root/runtime/chrome-sandbox\"\necho \"SUNBROWSER_LOCALFP_ROOT=$root\" >> \"$GITHUB_ENV\"\necho \"SUNBROWSER_REGION=$SUNBROWSER_REGION_INPUT\"\
        \ >> \"$GITHUB_ENV\"\n\"$root/runtime/SunBrowser\" --protected-disable-safe-open --version\necho \"SunBrowser package\
        \ archive and manifest: PASS\"\n"
    - name: System dependencies
      shell: bash
      run: "set -euxo pipefail\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  xvfb xauth ca-certificates\
        \ curl unzip fontconfig software-properties-common \\\n  fonts-liberation fonts-noto fonts-noto-cjk fonts-crosextra-carlito\
        \ fonts-crosextra-caladea\nsudo apt-get install -y --no-install-recommends fonts-selawik || true\nsudo add-apt-repository\
        \ -y multiverse || true\nsudo apt-get update || true\necho \"ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula\
        \ select true\" | sudo debconf-set-selections || true\nsudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer\
        \ || true\nfc-cache -f\n"
    - name: Python environment
      shell: bash
      run: "set -euxo pipefail\npython3 -m venv .venv\n. .venv/bin/activate\npython -m pip install --upgrade pip wheel setuptools\n\
        pip install -r requirements.txt\nif [ \"same_session_oauth_security_email_fresh1\" != \"sunbrowser_thin_natural\"\
        \ ] && [ \"same_session_oauth_security_email_fresh1\" != \"same_session_oauth_sunbrowser\" ] && [ \"same_session_oauth_security_email_fresh1\"\
        \ != \"same_session_oauth_security_email\" ] && [ \"same_session_oauth_security_email_fresh1\" != \"same_session_oauth_security_email_fresh1\"\
        \ ]; then\n  set +e\n  python -m cloakbrowser install\n  cb_code=$?\n  set -e\n  if [ \"$cb_code\" -ne 0 ]; then\n\
        \    echo \"cloakbrowser install exited $cb_code; checking extracted binary\"\n    test -x \"$(ls -1d \"$HOME\"/.cloakbrowser/chromium-*/chrome\
        \ 2>/dev/null | tail -1)\"\n  fi\nelse\n  echo \"SunBrowser variant selected; skipping CloakBrowser binary install\"\
        \nfi\n"
    - name: Install Windows-like font family aliases
      shell: bash
      run: "set -euxo pipefail\n. .venv/bin/activate\npython - <<'PY'\nfrom fontTools.ttLib import TTFont\nfrom pathlib import\
        \ Path\n\nout = Path.home() / \".local/share/fonts/windows-ctf\"\nout.mkdir(parents=True, exist_ok=True)\n\ndef pick(*paths):\n\
        \    return next((Path(p) for p in paths if Path(p).exists()), None)\n\ndefault_src = pick(\n    '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',\n\
        \    '/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf',\n    '/usr/share/fonts/truetype/msttcorefonts/Arial.ttf',\n\
        \    '/usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf',\n)\nselawik_src = pick(\n    '/usr/share/fonts/truetype/selawik/Selawik.ttf',\n\
        \    '/usr/share/fonts/truetype/selawik/Selawik-Regular.ttf',\n) or default_src\ncalibri_src = pick(\n    '/usr/share/fonts/truetype/crosextra/Carlito-Regular.ttf',\n\
        \    '/usr/share/fonts/truetype/msttcorefonts/Arial.ttf',\n) or default_src\nmsgothic_src = pick(\n    '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',\n\
        \    '/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc',\n) or default_src\nif not default_src:\n    raise SystemExit('no\
        \ base font found')\n\ndef set_name(font, name_id, value):\n    font['name'].setName(value, name_id, 3, 1, 0x409)\n\
        \    font['name'].setName(value, name_id, 1, 0, 0)\n\nfamilies = [\n    ('Segoe UI', 'Regular', selawik_src),\n  \
        \  ('Segoe UI Light', 'Regular', selawik_src),\n    ('Calibri', 'Regular', calibri_src),\n    ('Cambria', 'Regular',\
        \ pick('/usr/share/fonts/truetype/crosextra/Caladea-Regular.ttf') or calibri_src),\n    ('Marlett', 'Regular', default_src),\n\
        \    ('MS UI Gothic', 'Regular', msgothic_src),\n    ('Franklin Gothic', 'Regular', default_src),\n]\nfor family,\
        \ subfamily, src in families:\n    try:\n        font = TTFont(str(src))\n    except Exception as exc:\n        if\
        \ exc.__class__.__name__ == 'TTLibFileIsCollectionError':\n            font = TTFont(str(src), fontNumber=0)\n   \
        \     else:\n            raise\n    full = f'{family} {subfamily}'\n    ps = ''.join(ch for ch in full if ch.isalnum())\n\
        \    set_name(font, 1, family)\n    set_name(font, 2, subfamily)\n    set_name(font, 4, full)\n    set_name(font,\
        \ 6, ps)\n    set_name(font, 16, family)\n    set_name(font, 17, subfamily)\n    font.save(str(out / f'{ps}.ttf'))\n\
        PY\nfc-cache -f \"$HOME/.local/share/fonts\"\nfc-match 'Segoe UI' | head -1\nfc-match 'Calibri' | head -1\n"
    - name: Normalize shell scripts
      shell: bash
      run: 'set -euxo pipefail

        sed -i ''s/\r$//'' run_xvfb_*.sh

        chmod +x run_xvfb_*.sh

        '
    - name: Record sanitized registration browser environment
      shell: bash
      env:
        GA_SLOT: '1'
        GA_VARIANT: same_session_oauth_security_email_fresh1
        GA_NETWORK_MODE: ga_own_ip
        GA_PUBLIC_IP: ${{ env.GA_PUBLIC_IP }}
      run: "set -euo pipefail\n. .venv/bin/activate\npython3 - <<'PY'\nimport hashlib\nimport importlib.metadata\nimport json\n\
        import os\nimport subprocess\nfrom pathlib import Path\n\nrelease_variant = os.environ.get('GA_VARIANT', '').startswith('release_5s_success_')\n\
        source = Path(\n    'config.release-5s-success-ga.json'\n    if release_variant else\n    'config.ctf.runtime.protocol1s-adssafe-stab-5-xvfb-linux-1920-20260707.manual.json'\n\
        )\ndata = json.loads(source.read_text(encoding='utf-8'))\ncontext = dict(data.get('context') or {})\ncloak = dict(data.get('cloakbrowser')\
        \ or {})\nmanifest = {\n    # This is intentionally a launchable, non-secret subset of the\n    # exact config. It\
        \ contains no profile directory, AdsPower ID,\n    # cookie, proxy credential, or account identifier.\n    'context':\
        \ context,\n    'cloakbrowser': cloak,\n    'patchright': {'use_cloakbrowser': bool((data.get('patchright') or {}).get('use_cloakbrowser'))},\n\
        \    'proxy': '',\n    'recovery_provenance': {\n        'schema': 1,\n        'source_sha': subprocess.check_output(['git',\
        \ 'rev-parse', 'HEAD'], text=True).strip(),\n        'slot': os.environ.get('GA_SLOT', ''),\n        'variant': os.environ.get('GA_VARIANT',\
        \ ''),\n        'network_mode': os.environ.get('GA_NETWORK_MODE', ''),\n        'xvfb_screen': '1920x1200x24' if release_variant\
        \ else '2560x1440x24',\n        'cloakbrowser_version': importlib.metadata.version('cloakbrowser'),\n        'source_config_sha256':\
        \ hashlib.sha256(source.read_bytes()).hexdigest(),\n        # Keep egress comparable without persisting an address\
        \ in\n        # the artifact; a proxy itself must be supplied separately.\n        'egress_sha256': hashlib.sha256(os.environ.get('GA_PUBLIC_IP',\
        \ '').encode()).hexdigest(),\n        'proxy_was_configured': bool(data.get('proxy')) or bool(os.environ.get('OUTLOOK_PROXY_URL')),\n\
        \    },\n}\nout = Path('Results/diagnostics/registration_browser_env.json')\nout.parent.mkdir(parents=True, exist_ok=True)\n\
        out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')\n# Safe confirmation only; do\
        \ not print headers, UA, fingerprints, or\n# any persistent-profile data into the public runner log.\nprint(json.dumps({'recorded':\
        \ True, 'schema': 1, 'proxy_was_configured': manifest['recovery_provenance']['proxy_was_configured']}))\nPY\n"
    - name: Prepare bounded paired diagnostic
      shell: bash
      run: "set -euo pipefail\ncat > preverify_observer.py <<'DIAGNOSTIC_FILE'\n\"\"\"Paired snapshot/current-cookie timing\
        \ experiment; stop after first preverify.\"\"\"\nfrom pathlib import Path\nfrom urllib.parse import urlsplit\nimport\
        \ hashlib, json, os, re, time\nOUT = Path('Results/diagnostics/preverify-observer')\nASSETS = {\n    ('client.hsprotect.net','/PXzC5j78di/main.min.js'),\n\
        \    ('iframe.hsprotect.net','/index.html'),\n}\n\ndef write(name, obj):\n    OUT.mkdir(parents=True, exist_ok=True)\n\
        \    (OUT/name).write_text(json.dumps(obj,indent=2),encoding='utf-8')\n\ndef asset(response):\n    u=urlsplit(response.url)\n\
        \    if (u.hostname,u.path) not in ASSETS: return\n    start=time.monotonic()\n    OUT.mkdir(parents=True, exist_ok=True)\n\
        \    try:\n        b=response.body()\n        if len(b)>2000000: raise ValueError('asset exceeds capture cap')\n \
        \       digest=hashlib.sha256(b).hexdigest()\n        OUT.mkdir(parents=True, exist_ok=True)\n        (OUT/(digest+('.js'\
        \ if u.path.endswith('.js') else '.html'))).write_bytes(b)\n        headers={k.lower():v for k,v in response.headers.items()}\n\
        \        row={'host':u.hostname,'path':u.path,'status':response.status,'bytes':len(b),'sha256':digest,\n         \
        \    'headers':{k:headers.get(k) for k in ('etag','last-modified','content-length','content-encoding')},\n       \
        \      'observer_elapsed_ms':round((time.monotonic()-start)*1000,3)}\n    except Exception as exc:\n        row={'host':u.hostname,'path':u.path,'capture_error_type':type(exc).__name__}\n\
        \    with (OUT/'assets.safe.jsonl').open('a',encoding='utf-8') as f:f.write(json.dumps(row)+'\\n')\n\ndef metadata_digest(v):\n\
        \    return hashlib.sha256(json.dumps({k:v.get(k) for k in ('px3','pxde','pxvid')},sort_keys=True,separators=(',',':')).encode()).hexdigest()\n\
        \ndef before(submitted, read_cookies):\n    if (OUT/'before.safe.json').exists(): os._exit(92)\n    arm=os.environ.get('READTIME_ARM')\n\
        \    if arm not in ('snapshot','current'): os._exit(93)\n    started=time.monotonic()\n    current=read_cookies()\n\
        \    original=dict(submitted)\n    complete=all(isinstance(current.get(k),str) and bool(current[k]) for k in ('px3','pxde','pxvid'))\n\
        \    same_visitor=bool(original.get('pxvid')) and original.get('pxvid')==current.get('pxvid')\n    if not complete\
        \ or not same_visitor:\n        write('aborted.safe.json',{'arm':arm,'complete_current_metadata':complete,'same_visitor':same_visitor,'request_sent':False})\n\
        \        os._exit(94)\n    if arm=='current':\n        # Only use values produced by this clean session's existing\
        \ cookie reader.\n        # Preserve the visitor ID, all signature fields, tokens and request order.\n        submitted['px3']=current['px3']\n\
        \        submitted['pxde']=current['pxde']\n    changed=[k for k in ('px3','pxde','pxvid') if original.get(k)!=submitted.get(k)]\n\
        \    assert set(changed)<=({'px3','pxde'} if arm=='current' else set())\n    fields={k:{'original_length':len(original.get(k,'')),\
        \ 'submitted_length':len(submitted.get(k,'')),\n               'current_length':len(current.get(k,'')), 'original_equals_current':original.get(k)==current.get(k),\n\
        \               'submitted_equals_current':submitted.get(k)==current.get(k)} for k in ('px3','pxde','pxvid')}\n  \
        \  write('before.safe.json',{'arm':arm,'fields':fields,'changed_fields':changed,'same_visitor':same_visitor,\n   \
        \       'observer_elapsed_ms':round((time.monotonic()-started)*1000,3),'sampled_at_epoch':time.time(),\n         \
        \ 'request_content_changed':bool(changed),'submitted_metadata_sha256':metadata_digest(submitted)})\n\ndef safe_code(v):\n\
        \    return v if isinstance(v,str) and re.fullmatch(r'[A-Za-z0-9_.-]{1,80}',v) else None\n\ndef stop(response, capture):\n\
        \    try:\n        body=response.get('json') or {};err=body.get('error') or {}\n        write('after.safe.json',{'status':response.get('status'),'state':safe_code(body.get('state')),\n\
        \              'error_code':safe_code(err.get('code')),'inner_code':safe_code((err.get('innerError') or {}).get('code')),\n\
        \              'stopped_after_preverify':True,'sampled_at_epoch':time.time()})\n        raw=Path('Results/protocol_runtime/preverify-stop.json');raw.parent.mkdir(parents=True,exist_ok=True)\n\
        \        raw.write_text(json.dumps({'collector_capture':capture,'saved_at':time.time()},default=str),encoding='utf-8')\n\
        \    finally:\n        # End only this one-shot experiment process, before challenge handling.\n        os._exit(0)\n\
        \nDIAGNOSTIC_FILE\ncat > instrument_preverify.py <<'DIAGNOSTIC_FILE'\n\"\"\"Apply exactly three observation/stop insertions\
        \ to a verified controller copy.\"\"\"\nfrom pathlib import Path\nimport ast, hashlib, json\nROOT=Path(__file__).resolve().parent\n\
        \ndef instrument(source):\n    anchors={\n      '                url = response.url\\n': '                import preverify_observer\\\
        n                preverify_observer.asset(response)\\n',\n      '                if preverify_transport in {\"api\"\
        , \"api_request\", \"context\", \"request\"}:\\n': '                import preverify_observer\\n                preverify_observer.before(pre_verify_body[\"\
        riskProviderMetadata\"][0], read_hsprotect_solution_cookies)\\n',\n      '                pre_json = pre_verify.get(\"\
        json\") if isinstance(pre_verify, dict) else None\\n': '                preverify_observer.stop(pre_verify, getattr(page,\
        \ \"_pxprobe_collector_capture\", {}))\\n',\n    }\n    changed=source\n    for old,addition in anchors.items():\n\
        \        assert changed.count(old)==1, 'Source anchor is not unique'\n        changed=changed.replace(old, addition+old\
        \ if 'if preverify_transport' in old else old+addition)\n    ast.parse(changed)\n    return changed\n\ndef main():\n\
        \    source_path=Path('controllers/base_controller.py')\n    source=source_path.read_text(encoding='utf-8')\n    manifest=json.loads(Path('experiment-source.safe.json').read_text(encoding='utf-8-sig'))\n\
        \    assert hashlib.sha256(source.encode()).hexdigest()==manifest['controller_normalized_sha256'], 'Controller mismatch'\n\
        \    target=instrument(source)\n    out=Path('Results/diagnostics/preverify-observer');out.mkdir(parents=True,exist_ok=True)\n\
        \    (out/'patch.safe.json').write_text(json.dumps({'base_sha256':manifest['controller_normalized_sha256'],'instrumented_sha256':hashlib.sha256(target.encode()).hexdigest(),'insertion_sites':3,'request_mutation':'current\
        \ arm: px3/pxde reread only'}),encoding='utf-8')\n    source_path.write_text(target,encoding='utf-8')\n    print('Verified\
        \ controller: three observation/stop insertions applied')\n\nif __name__=='__main__':main()\n\nDIAGNOSTIC_FILE\ncat\
        \ > validate_run.py <<'DIAGNOSTIC_FILE'\n\"\"\"Validate the one-shot boundary and publish only an allowlisted summary.\"\
        \"\"\nfrom pathlib import Path\nfrom urllib.parse import urlsplit\nfrom collections import Counter\nimport json, hashlib\n\
        \ndef main():\n    root=Path('Results/diagnostics/preverify-observer')\n    before=json.loads((root/'before.safe.json').read_text())\n\
        \    after=json.loads((root/'after.safe.json').read_text())\n    events=[];network=[]\n    for pattern,target in [('Results/protocol_takeover/*.jsonl',events),('Results/network/*.jsonl',network)]:\n\
        \        for p in Path().glob(pattern):\n            target.extend(json.loads(x) for x in p.read_text(encoding='utf-8-sig').splitlines()\
        \ if x)\n    pre=[e for e in events if e.get('event')=='risk_verify_pre_request']\n    post=[e for e in events if\
        \ e.get('event')=='risk_verify_post_request']\n    requests=[e for e in network if e.get('event')=='request']\n  \
        \  creates=[e for e in requests if urlsplit(e.get('url','')).path.lower().endswith('/createaccount')]\n    captcha=[e\
        \ for e in requests if urlsplit(e.get('url','')).path.endswith('/captcha.js')]\n    verify=[e for e in requests if\
        \ e.get('method')=='POST' and urlsplit(e.get('url','')).path.endswith('/risk/verify')]\n    assert len(pre)==1 and\
        \ len(verify)==1 and not post and not creates and not captcha\n    assert after['stopped_after_preverify'] is True\n\
        \    sent=json.loads(pre[0]['body'])\n    actual=json.loads(verify[0]['post_data'])\n    assert sent==actual, 'Protocol\
        \ and actual network body differ'\n    provider=next(x for x in sent['riskProviderMetadata'] if x['riskProvider']=='Human')\n\
        \    digest=hashlib.sha256(json.dumps({k:provider.get(k) for k in ('px3','pxde','pxvid')},sort_keys=True,separators=(',',':')).encode()).hexdigest()\n\
        \    assert digest==before['submitted_metadata_sha256'], 'Observed and transmitted metadata differ'\n    assert before['arm']\
        \ in ('snapshot','current') and before['same_visitor'] is True\n    assert set(before['changed_fields']) <= ({'px3','pxde'}\
        \ if before['arm']=='current' else set())\n    if before['arm']=='current': assert all(v['submitted_equals_current']\
        \ for v in before['fields'].values())\n    assets=[json.loads(x) for x in (root/'assets.safe.jsonl').read_text().splitlines()\
        \ if x]\n    assert any(r.get('path','').endswith('main.min.js') and r.get('sha256') and r.get('bytes',0)>100000 for\
        \ r in assets)\n    builds=[]\n    for n in network:\n        if n.get('event')=='response' and '/risk/' in n.get('url',''):\n\
        \            headers={k.lower():v for k,v in (n.get('headers') or {}).items()}\n            v=headers.get('x-ms-ests-server')\n\
        \            if v: builds.append({'path':urlsplit(n['url']).path.rsplit('/',1)[-1],'status':n.get('status'),'server':v})\n\
        \    summary={'boundary_verified':True,'preverify_requests':1,'postverify_requests':0,'create_requests':0,'captcha_js_requests':0,\n\
        \             'before':before,'after':after,'assets':assets,'service_builds':builds,'success_rate_measured':False,'transmitted_metadata_verified':True}\n\
        \    out=Path('public-preverify-summary');out.mkdir(exist_ok=True)\n    (out/'summary.safe.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')\n\
        \    print(json.dumps({'boundary_verified':True,'preverify_status':after.get('status'),'create_requests':0,'captcha_js_requests':0}))\n\
        \nif __name__=='__main__':main()\n\nDIAGNOSTIC_FILE\ncat > experiment-source.safe.json <<'DIAGNOSTIC_FILE'\n{\n  \"\
        source_sha\": \"c98f52a1fab80df3ab125ebb2b221521965f8b2b\",\n  \"local_equivalent_tree\": \"569dea0de0059d5fff4e50b25a5e6aef51460678\"\
        ,\n  \"controller_normalized_sha256\": \"c8b52c7c99b4e8679b7cf3fc9d19d42a67df149d5efed2f1241c9e8a6f8ac3b7\"\n}\nDIAGNOSTIC_FILE\n\
        cat > run_pair.py <<'DIAGNOSTIC_FILE'\n\"\"\"One randomized pair on one GA runner, with separately extracted clean\
        \ profiles.\"\"\"\nfrom pathlib import Path, PurePosixPath\nimport hashlib, ipaddress, json, os, re, secrets, shutil,\
        \ subprocess, tarfile, time\nROOT=Path.cwd().resolve()\nARMS=('snapshot','current')\n\ndef save(path,obj):\n    path.parent.mkdir(parents=True,exist_ok=True)\n\
        \    path.write_text(json.dumps(obj,indent=2),encoding='utf-8')\n\ndef safe_extract(archive,dest):\n    dest=dest.resolve()\n\
        \    assert not dest.exists(), 'Arm directory already exists'\n    with tarfile.open(archive,'r:') as t:\n       \
        \ members=t.getmembers()\n        for m in members:\n            p=PurePosixPath(m.name)\n            if p.is_absolute()\
        \ or '..' in p.parts or not (m.isdir() or m.isfile()):\n                raise ValueError('Unsafe archive member')\n\
        \            if not (dest/Path(*p.parts)).resolve().is_relative_to(dest):raise ValueError('Archive outside arm')\n\
        \        dest.mkdir(parents=True)\n        for m in members:\n            target=dest/Path(*PurePosixPath(m.name).parts)\n\
        \            if m.isdir():target.mkdir(parents=True,exist_ok=True);continue\n            target.parent.mkdir(parents=True,exist_ok=True)\n\
        \            with target.open('xb') as out:shutil.copyfileobj(t.extractfile(m),out)\n            target.chmod(m.mode\
        \ & 0o777)\n\ndef egress():\n    r=subprocess.run(['curl','-fsS','--max-time','15','https://api.ipify.org'],capture_output=True,text=True,timeout=20,check=True)\n\
        \    ip=str(ipaddress.ip_address(r.stdout.strip()))\n    return hashlib.sha256(ip.encode()).hexdigest()\n\ndef main():\n\
        \    assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'\n    runid=os.environ['GITHUB_RUN_ID'];assert re.fullmatch(r'\\\
        d+',runid)\n    parent=ROOT/'Results/diagnostics/readtime-pair'\n    assert not parent.exists(), 'Pair journal exists;\
        \ never repeat'\n    parent.mkdir(parents=True)\n    order=list(ARMS)\n    if secrets.randbits(1):order.reverse()\n\
        \    save(parent/'order.safe.json',{'order':order,'selection':'one random bit before first session','max_sessions':2,'max_preverify_requests':2})\n\
        \    manifest=json.loads((ROOT/'experiment-source.safe.json').read_text())\n    assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==manifest['source_sha']\n\
        \    archive=ROOT/'.readtime-source.tar'\n    assert not archive.exists()\n    subprocess.run(['git','archive','--format=tar','--output',str(archive),'HEAD'],check=True)\n\
        \    prior_ip=egress();runs=[];session_identities=[]\n    for index,arm in enumerate(order):\n        current_ip=egress();assert\
        \ current_ip==prior_ip, 'Egress probe changed; stop pair'\n        work=ROOT/'experiment-arms'/arm\n        safe_extract(archive,work)\n\
        \        assert not (work/'profiles').exists() and not (work/'Results').exists()\n        (work/'.venv').symlink_to(ROOT/'.venv',target_is_directory=True)\n\
        \        for name in ('preverify_observer.py','instrument_preverify.py','validate_run.py','experiment-source.safe.json'):\n\
        \            shutil.copyfile(ROOT/name,work/name)\n        env=dict(os.environ,READTIME_ARM=arm,GA_SLOT=str(index+1),OUTLOOK_SAME_SESSION_OAUTH='0',SECURITY_EMAIL_BINDING='0')\n\
        \        subprocess.run([str(ROOT/'.venv/bin/python'),'instrument_preverify.py'],cwd=work,env=env,check=True)\n  \
        \      log=work/'Results/diagnostics/private-console.log';log.parent.mkdir(parents=True,exist_ok=True)\n        record={'arm':arm,'index':index,'clean_profile_root_before':True,'egress_probe_sha256':current_ip,'started_at_epoch':time.time()}\n\
        \        save(parent/(arm+'.safe.json'),record)\n        try:\n            with log.open('wb') as out:\n         \
        \       result=subprocess.run(['timeout','--foreground','180s','./run_xvfb_sunbrowser_natural_1920.sh'],cwd=work,env=env,stdout=out,stderr=subprocess.STDOUT,timeout=205)\n\
        \            record.update(exit_code=result.returncode,finished_at_epoch=time.time())\n            text=log.read_text(encoding='utf-8',errors='replace')\n\
        \            record['browser_cleanup_confirmed']=bool(re.search(r'\\[SunBrowser\\] cleanup pid=\\d+ stopped=yes',text))\n\
        \            assert record['browser_cleanup_confirmed'], 'Browser cleanup not confirmed; stop pair'\n            subprocess.run([str(ROOT/'.venv/bin/python'),'validate_run.py'],cwd=work,env=env,check=True)\n\
        \            summary=json.loads((work/'public-preverify-summary/summary.safe.json').read_text())\n            assert\
        \ summary['before']['arm']==arm\n            # Verify distinct actual visitors/tokens without publishing raw values.\n\
        \            events=[]\n            for f in (work/'Results/protocol_takeover').glob('*.jsonl'):\n               \
        \ events.extend(json.loads(x) for x in f.read_text().splitlines() if x)\n            body=json.loads(next(e['body']\
        \ for e in events if e.get('event')=='risk_verify_pre_request'))\n            visitor=next(p['pxvid'] for p in body['riskProviderMetadata']\
        \ if p['riskProvider']=='Human')\n            identity=(hashlib.sha256(visitor.encode()).hexdigest(),hashlib.sha256(body['continuationToken'].encode()).hexdigest())\n\
        \            assert all(identity[0]!=v[0] and identity[1]!=v[1] for v in session_identities), 'Session identities\
        \ reused'\n            session_identities.append(identity)\n            record['boundary_verified']=True;record['preverify_status']=summary['after']['status']\n\
        \            save(ROOT/'public-preverify-summary'/(arm+'.safe.json'),summary)\n            runs.append(record)\n \
        \       finally:\n            save(parent/(arm+'.safe.json'),record)\n            if (work/'Results').exists():shutil.copytree(work/'Results',ROOT/'Results/pair'/arm)\n\
        \    final_ip=egress()\n    pair={'run_id':runid,'order':order,'arms':runs,'distinct_visitors_and_tokens':True,'egress_probe_stable':final_ip==prior_ip,\n\
        \          'same_runner':True,'max_preverify_requests':2,'actual_preverify_requests':2,'create_requests':0,'captcha_js_requests':0,\n\
        \          'conclusion_scope':'one pair, not a success-rate estimate or unique causal attribution'}\n    save(parent/'pair.safe.json',pair);save(ROOT/'public-preverify-summary/pair.safe.json',pair)\n\
        \    assert pair['egress_probe_stable'], 'Egress probe changed at end'\n    print(json.dumps({'pair_completed':True,'order':order,'statuses':[r['preverify_status']\
        \ for r in runs],'create_requests':0}))\n\nif __name__=='__main__':main()\n\nDIAGNOSTIC_FILE\npython3 -m py_compile\
        \ preverify_observer.py instrument_preverify.py validate_run.py run_pair.py\n"
    - name: Run one randomized clean-session pair
      id: observe
      shell: bash
      timeout-minutes: 9
      env:
        OUTLOOK_SAME_SESSION_OAUTH: '0'
        SECURITY_EMAIL_BINDING: '0'
      run: 'set -euo pipefail

        mkdir -p Results/diagnostics

        . .venv/bin/activate

        python -m pip freeze > Results/diagnostics/python-dependencies.txt

        dpkg-query -W > Results/diagnostics/system-packages.txt

        python run_pair.py

        '
    - name: Encrypt evidence before public artifact upload
      if: ${{ always() }}
      shell: bash
      run: "set -euo pipefail\ntest -n \"${RESULTS_ENCRYPTION_CERT_B64:-}\"\nmkdir -p public-artifacts .public-encryption\n\
        printf '%s' \"$RESULTS_ENCRYPTION_CERT_B64\" | base64 -d > .public-encryption/results_public_cert.pem\ntar -C Results\
        \ -czf .public-encryption/results.tar.gz .\nopenssl cms -encrypt -binary -aes-256-cbc \\\n  -in .public-encryption/results.tar.gz\
        \ \\\n  -out public-artifacts/evidence-${{ github.run_id }}-1.cms \\\n  -outform DER \\\n  .public-encryption/results_public_cert.pem\n\
        rm -rf .public-encryption\n"
    - name: Upload encrypted diagnostic evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: readtime-pair-encrypted-${{ github.run_id }}
        path: public-artifacts/*.cms
        if-no-files-found: error
        retention-days: 3
    - name: Upload allowlisted summary
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: readtime-pair-summary-${{ github.run_id }}
        path: public-preverify-summary/*.safe.json
        if-no-files-found: error
        retention-days: 14
